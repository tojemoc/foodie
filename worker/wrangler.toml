name                  = "foodie-api"
main                  = "src/index.ts"
compatibility_date    = "2024-01-01"
compatibility_flags   = ["nodejs_compat"]

# Hourly tick — expiry digest delivers around 08:00 in each user's timezone
# (prefs.timezone, default Europe/Bratislava) for items expiring within 7 days.
[triggers]
crons = ["0 * * * *"]

# ── Production KV ─────────────────────────────────────────────
[[kv_namespaces]]
binding = "FOODIE_KV"
id      = "c10dfc1b686d4d95a207bc18f5f96573"

# Atomic single-use magic-link / passcode consume (one DO per credential key).
[[durable_objects.bindings]]
name = "MAGIC_LINK_GATE"
class_name = "MagicLinkGate"

[[migrations]]
tag = "v1-magic-link-gate"
new_sqlite_classes = ["MagicLinkGate"]

# ── Production vars ────────────────────────────────────────────
[vars]
FRONTEND_ORIGIN  = "https://foodie-prod.pages.dev"
FRONTEND_RP_ID   = "foodie-prod.pages.dev"
EMAIL_FROM       = "foodie@tjm.sk"
EMAIL_FROM_NAME  = "Foodie Team"

# Secrets — set via CLI, never commit values:
#   wrangler secret put JWT_SECRET
#   wrangler secret put BREVO_API_KEY
#   wrangler secret put VAPID_PRIVATE_KEY
#
# Web Push public key (safe to expose) — also set as a var / secret:
#   wrangler secret put VAPID_PUBLIC_KEY
# Or add VAPID_PUBLIC_KEY under [vars] once generated.
# Generate a pair locally with Web Crypto (see README).
#
# Local-only (never enable in prod): MAGIC_DEV_ECHO=1 in .dev.vars echoes
# magic token/code when BREVO_API_KEY is unset.

# ── Staging environment ────────────────────────────────────────
# Deploy with: wrangler deploy --env staging
# Secrets:     wrangler secret put JWT_SECRET --env staging
#              wrangler secret put BREVO_API_KEY --env staging
#              wrangler secret put VAPID_PRIVATE_KEY --env staging
#              wrangler secret put VAPID_PUBLIC_KEY --env staging
[env.staging]
name = "foodie-api-staging"

[[env.staging.kv_namespaces]]
binding = "FOODIE_KV"
id      = "f14a4873b1144683b90317d75b6a79ab"

[[env.staging.durable_objects.bindings]]
name = "MAGIC_LINK_GATE"
class_name = "MagicLinkGate"

[env.staging.vars]
FRONTEND_ORIGIN  = "https://foodie-staging.pages.dev"
FRONTEND_RP_ID   = "foodie-staging.pages.dev"
EMAIL_FROM       = "foodie@tjm.sk"
EMAIL_FROM_NAME  = "Foodie Staging"

[env.staging.triggers]
crons = ["0 * * * *"]

# ── Local dev ──────────────────────────────────────────────────
[dev]
port = 8787
