# Deploy Worker + Cloudflare Pages from `main` (staging / preview stack).
# Inspired by https://github.com/tojemoc/cardex/blob/main/.github/workflows/staging.yml
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#   CLOUDFLARE_PAGES_PROJECT_STAGING  — Pages project name (e.g. foodie-staging)
#
# Create the Pages project once in the Cloudflare dashboard (or via `wrangler pages project create`),
# then set the secret to match the project name.

name: Deploy to Staging

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '*.md'

jobs:
  deploy-worker-staging:
    runs-on: ubuntu-latest
    name: Deploy Worker (staging)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Typecheck worker
        working-directory: worker
        run: npm run typecheck

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --env staging --var VERSION:${{ github.sha }}

  deploy-frontend-staging:
    runs-on: ubuntu-latest
    name: Deploy Pages (staging)
    needs: deploy-worker-staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages (staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_STAGING }} --branch=main
