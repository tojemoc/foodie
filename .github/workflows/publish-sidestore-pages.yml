# Publish SideStore Pages
# Rebuilds https://tojemoc.github.io/foodie/ (altstore-source.json + index)
# via actions/deploy-pages from existing GitHub Releases — no IPA rebuild.
#
# Use this when the AltStore source URL 404s or is stale — especially after
# someone re-ran GitHub's dynamic "pages-build-deployment" workflow (no workflow
# file; it deploys raw /docs markdown and wipes the Actions-published site).

name: Publish SideStore Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-sidestore-pages
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Guard main only
        if: ${{ github.ref != 'refs/heads/main' }}
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          echo "::error::Publish SideStore Pages is only allowed from main (got ${DISPATCH_REF})."
          exit 1

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate AltStore source from GitHub Releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/generate-altstore-source.py \
            --meta docs/altstore-source.meta.json \
            --output docs/altstore-source.json

      - name: Assemble SideStore Pages site
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: python3 scripts/build-sidestore-pages-site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
