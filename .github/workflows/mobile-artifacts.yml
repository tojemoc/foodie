# Mobile artifacts (SideStore)
# Manual unsigned iOS IPA (+ optional Android APK) for SideStore / AltStore.
# Mirrors the approach used in tojemoc/vmp and tojemoc/floaty.

name: Mobile artifacts

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: API base URL baked into EXPO_PUBLIC_API_URL
        required: true
        type: string
      frontend_host:
        description: Frontend host for Universal / App Links
        required: true
        type: string
      flavor:
        description: Release channel label (used in GitHub Release tag)
        required: true
        default: development
        type: choice
        options:
          - release
          - beta
          - nightly
          - development
      build_number:
        description: iOS build number (defaults to this workflow run number; encoded into marketing patch for SideStore)
        required: false
        type: string
      publish_release:
        description: Publish GitHub Release + regenerate AltStore source JSON + deploy GitHub Pages
        required: true
        default: true
        type: boolean
      build_android:
        description: Also build and upload an Android release APK
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-artifacts-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPO_NO_TELEMETRY: 1
  CI: 1

jobs:
  validate-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Guard publishing from main only
        if: ${{ inputs.publish_release && github.ref != 'refs/heads/main' }}
        working-directory: ${{ github.workspace }}
        run: |
          echo "::error::Publishing is only allowed from main. Disable publish_release for feature-branch artifact builds."
          exit 1

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: SideStore marketing-version helper tests
        working-directory: ${{ github.workspace }}
        run: node --test scripts/ios-sidestore-marketing-version.test.mjs

  build-ios:
    needs: validate-mobile
    # Expo SDK 57 / expo-modules-jsi requires Swift tools 6.2+ (Xcode 26.4+).
    # macos-15 defaults to Xcode 16.4 (Swift 6.1) and fails with:
    #   package 'apple' is using Swift tools version 6.2.0 but the installed version is 6.1.0
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
      EXPO_PUBLIC_FRONTEND_HOST: ${{ inputs.frontend_host }}
      FRONTEND_HOST: ${{ inputs.frontend_host }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 26.4+
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # Prefer the newest installed 26.4+ toolchain; fall back to image default.
          candidates=(
            /Applications/Xcode_26.5.app
            /Applications/Xcode_26.4.1.app
            /Applications/Xcode_26.4.app
            /Applications/Xcode.app
          )
          selected=""
          for app in "${candidates[@]}"; do
            if [[ -d "$app" ]]; then
              selected="$app"
              break
            fi
          done
          if [[ -z "$selected" ]]; then
            echo "::error::No Xcode 26.x installation found (Expo SDK 57 requires Xcode 26.4+)."
            ls /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$selected/Contents/Developer"
          xcodebuild -version
          xcrun swift --version

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Parse mobile version
        id: version
        working-directory: ${{ github.workspace }}
        env:
          INPUT_BUILD: ${{ inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # app.json expo.version is the major.minor(.patch) base only. SideStore's
          # hasUpdate compares CFBundleShortVersionString (SemanticVersion),
          # not buildVersion — so CI encodes the build into the patch component
          # (3.0.0 + build 10 → 3.0.10). See scripts/ios-sidestore-marketing-version.mjs.
          VERSION_BASE="$(node -p "require('./mobile/app.json').expo.version")"
          if [ -n "${INPUT_BUILD}" ]; then
            BUILD_NUMBER="${INPUT_BUILD}"
          else
            BUILD_NUMBER="${RUN_NUMBER}"
          fi
          if ! [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::iOS build number must be a positive integer without leading zeros. Found: $BUILD_NUMBER"
            exit 1
          fi
          VERSION_NAME="$(node scripts/ios-sidestore-marketing-version.mjs "$VERSION_BASE" "$BUILD_NUMBER")"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "base=$VERSION_BASE" >> "$GITHUB_OUTPUT"
          echo "Version name: $VERSION_NAME (base $VERSION_BASE), build: $BUILD_NUMBER"

      - name: Inject CI frontend host, marketing version, and build number
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'app.json';
          const host = process.env.FRONTEND_HOST;
          const build = process.env.BUILD_NUMBER;
          const versionName = process.env.VERSION_NAME;
          const app = JSON.parse(fs.readFileSync(path, 'utf8'));
          // Must match CFBundleShortVersionString / AltStore source "version"
          // so SideStore offers Update (buildVersion-only bumps are ignored).
          app.expo.version = versionName;
          app.expo.ios = app.expo.ios || {};
          app.expo.ios.associatedDomains = [`applinks:${host}`];
          app.expo.ios.buildNumber = String(build);
          app.expo.android = app.expo.android || {};
          app.expo.android.intentFilters = (app.expo.android.intentFilters || []).map((filter) => ({
            ...filter,
            data: (filter.data || []).map((entry) =>
              entry.scheme === 'https' ? { ...entry, host } : entry,
            ),
          }));
          fs.writeFileSync(path, `${JSON.stringify(app, null, 2)}\n`);
          NODE

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Foodie.xcworkspace \
            -scheme Foodie \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Package IPA for SideStore
        working-directory: ${{ github.workspace }}
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          APP_PATH="mobile/ios/build/Build/Products/Release-iphoneos/Foodie.app"
          mkdir -p "dist/${VERSION_NAME}"
          chmod +x scripts/package-ios-ipa-for-sidestore.sh
          scripts/package-ios-ipa-for-sidestore.sh \
            "$APP_PATH" \
            "dist/${VERSION_NAME}/foodie-${VERSION_NAME}-ios.ipa"
          echo "VERSION=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"

      - name: Verify IPA Info.plist versions for SideStore
        working-directory: ${{ github.workspace }}
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          IPA="dist/${VERSION_NAME}/foodie-${VERSION_NAME}-ios.ipa"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          unzip -q "$IPA" -d "$TMP"
          PLIST="$TMP/Payload/Foodie.app/Info.plist"
          SHORT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          if [ "$SHORT" != "$VERSION_NAME" ]; then
            echo "::error::CFBundleShortVersionString is '$SHORT', expected '$VERSION_NAME' (SideStore update detection)"
            exit 1
          fi
          if [ "$BUILD" != "$BUILD_NUMBER" ]; then
            echo "::error::CFBundleVersion is '$BUILD', expected '$BUILD_NUMBER'"
            exit 1
          fi
          echo "Info.plist OK: CFBundleShortVersionString=$SHORT CFBundleVersion=$BUILD"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ios-ipa
          path: dist/**/*.ipa
          if-no-files-found: error

  build-android:
    if: ${{ inputs.build_android }}
    needs: validate-mobile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
      EXPO_PUBLIC_FRONTEND_HOST: ${{ inputs.frontend_host }}
      FRONTEND_HOST: ${{ inputs.frontend_host }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install mobile dependencies
        run: npm ci

      - name: Parse mobile version
        id: version
        working-directory: ${{ github.workspace }}
        env:
          INPUT_BUILD: ${{ inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          VERSION_BASE="$(node -p "require('./mobile/app.json').expo.version")"
          if [ -n "${INPUT_BUILD}" ]; then
            BUILD_NUMBER="${INPUT_BUILD}"
          else
            BUILD_NUMBER="${RUN_NUMBER}"
          fi
          if ! [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Android build number must be a positive integer without leading zeros. Found: $BUILD_NUMBER"
            exit 1
          fi
          VERSION_NAME="$(node scripts/ios-sidestore-marketing-version.mjs "$VERSION_BASE" "$BUILD_NUMBER")"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "base=$VERSION_BASE" >> "$GITHUB_OUTPUT"
          echo "Version name: $VERSION_NAME (base $VERSION_BASE), build: $BUILD_NUMBER"

      - name: Inject CI frontend host, marketing version, and versionCode
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const host = process.env.FRONTEND_HOST;
          const build = process.env.BUILD_NUMBER;
          const versionName = process.env.VERSION_NAME;
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          // Match iOS / release label: versionName advertises the marketing version.
          app.expo.version = versionName;
          app.expo.ios = app.expo.ios || {};
          app.expo.ios.associatedDomains = [`applinks:${host}`];
          app.expo.android = app.expo.android || {};
          app.expo.android.versionCode = Number(build);
          app.expo.android.intentFilters = (app.expo.android.intentFilters || []).map((filter) => ({
            ...filter,
            data: (filter.data || []).map((entry) =>
              entry.scheme === 'https' ? { ...entry, host } : entry,
            ),
          }));
          fs.writeFileSync('app.json', `${JSON.stringify(app, null, 2)}\n`);
          NODE

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Package Android artifact
        run: |
          mkdir -p dist
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/foodie-mobile-${SHORT_SHA}.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-apk
          path: mobile/dist/*.apk
          if-no-files-found: error

  publish:
    # Wait for Android when it ran so Pages can publish nightly.link APK URLs.
    # Android failure/skip must not block the iOS Release + AltStore Pages publish.
    if: >-
      ${{
        !cancelled()
        && inputs.publish_release
        && needs.build-ios.result == 'success'
        && (
          needs.build-android.result == 'success'
          || needs.build-android.result == 'skipped'
          || needs.build-android.result == 'failure'
          || needs.build-android.result == 'cancelled'
        )
      }}
    needs:
      - build-ios
      - build-android
    runs-on: ubuntu-latest
    # Serialize AltStore feed generation → Pages deploy with the manual
    # publish-sidestore-pages workflow. Workflow-level concurrency above still
    # gates the rest of Mobile artifacts (build/validate) per ref.
    concurrency:
      group: publish-sidestore-pages
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: mobile-ios-ipa
          path: ./artifacts/ios

      - name: Download Android APK
        if: ${{ needs.build-android.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: mobile-android-apk
          path: ./artifacts/android

      - name: Stage release files
        id: stage
        env:
          INPUT_BUILD: ${{ inputs.build_number }}
          INPUT_FLAVOR: ${{ inputs.flavor }}
          RUN_NUMBER: ${{ github.run_number }}
          ANDROID_JOB_RESULT: ${{ needs.build-android.result }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release/ios release/android
          find ./artifacts/ios -name '*.ipa' -exec cp {} release/ios/ \;
          VERSION_BASE="$(node -p "require('./mobile/app.json').expo.version")"
          BUILD="${INPUT_BUILD:-$RUN_NUMBER}"
          FLAVOR="${INPUT_FLAVOR}"
          # Reject CR/LF so values cannot inject or replace GITHUB_OUTPUT commands.
          case "$BUILD" in
            *$'\n'*|*$'\r'*)
              echo "::error::Invalid build number: contains newline or carriage return"
              exit 1
              ;;
          esac
          if ! [[ "$BUILD" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::iOS build number must be a positive integer without leading zeros. Found: $BUILD"
            exit 1
          fi
          # Must match CFBundleShortVersionString baked into the IPA (SideStore
          # compares marketing version only; buildVersion-only bumps stay Open).
          VERSION="$(node scripts/ios-sidestore-marketing-version.mjs "$VERSION_BASE" "$BUILD")"
          # SideStore ignores equal marketing versions. Reject publish unless this
          # candidate is strictly greater than every already-published tag version
          # (also blocks same-run_number reruns that would overwrite assets under
          # the same 3.0.N label). Build-only dispatches never reach this job.
          LATEST="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
              --jq '.[] | select(.draft|not) | .tag_name' \
              | sed -nE 's/.*-v([0-9]+(\.[0-9]+)+)-build[0-9]+$/\1/p' \
              | node --input-type=module -e '
                  import { maxMarketingVersion } from "./scripts/ios-sidestore-marketing-version.mjs";
                  const versions = [];
                  for await (const chunk of process.stdin) {
                    versions.push(...String(chunk).split(/\r?\n/));
                  }
                  const best = maxMarketingVersion(versions);
                  process.stdout.write(best ?? "");
                '
          )"
          if ! node scripts/ios-sidestore-marketing-version.mjs --assert-greater "${LATEST}" "$VERSION"; then
            echo "::error::Refusing to publish marketing version ${VERSION}; latest published is ${LATEST:-none}. Bump build_number (or wait for a new run_number) so major.minor.patch increases."
            exit 1
          fi
          has_apk=false
          if [ "$ANDROID_JOB_RESULT" = "success" ]; then
            apk="$(find ./artifacts/android -name '*.apk' | head -1 || true)"
            if [ -n "$apk" ]; then
              cp "$apk" "release/android/foodie-${VERSION}-android.apk"
              has_apk=true
            else
              echo "::warning::Android job succeeded but no .apk was found in the artifact."
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "tag=${FLAVOR}-v${VERSION}-build${BUILD}" >> "$GITHUB_OUTPUT"
          echo "has_apk=${has_apk}" >> "$GITHUB_OUTPUT"
          ls -la release/ios/ release/android/ || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stage.outputs.tag }}
          name: ${{ inputs.flavor }} v${{ steps.stage.outputs.version }} (build ${{ steps.stage.outputs.build }})
          body: |
            ## Foodie ${{ inputs.flavor }} mobile build

            - Version: `${{ steps.stage.outputs.version }}`
            - Build: `${{ steps.stage.outputs.build }}`
            - API: `${{ inputs.api_url }}`
            - Commit: `${{ github.sha }}`

            Install page (SideStore source + IPA/APK downloads):  
            `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/`

            **SideStore / AltStore:** add source  
            `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/altstore-source.json`
          prerelease: ${{ inputs.flavor != 'release' }}
          fail_on_unmatched_files: false
          files: |
            release/ios/*
            release/android/*

      - name: Generate AltStore source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALTSTORE_WAIT_RELEASE_TAG: ${{ steps.stage.outputs.tag }}
        run: |
          python3 scripts/generate-altstore-source.py \
            --meta docs/altstore-source.meta.json \
            --output docs/altstore-source.json

      - name: Upload AltStore source artifact
        uses: actions/upload-artifact@v4
        with:
          name: altstore-source
          path: docs/altstore-source.json

      # Do not re-run GitHub's dynamic pages-build-deployment — it deploys raw
      # /docs markdown and wipes this Actions-published site. Use Actions →
      # Publish SideStore Pages to restore or refresh without a full IPA build.
      # nightly.link "latest by branch" only queries push/schedule; workflow_dispatch
      # needs a run-scoped URL. Publish that evergreen pointer on Pages.
      - name: Assemble SideStore Pages site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          MOBILE_ARTIFACTS_RUN_ID: ${{ github.run_id }}
          VERSION_NAME: ${{ steps.stage.outputs.version }}
          BUILD_NUMBER: ${{ steps.stage.outputs.build }}
          FLAVOR_LABEL: ${{ inputs.flavor }}
          ANDROID_JOB_RESULT: ${{ needs.build-android.result }}
        run: python3 scripts/build-sidestore-pages-site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
