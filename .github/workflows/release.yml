# Deploy Worker + Cloudflare Pages from a version tag (production).
# Inspired by https://github.com/tojemoc/cardex/blob/main/.github/workflows/release.yml
#
# Tag example: git tag v0.1.0 && git push origin v0.1.0
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#   CLOUDFLARE_PAGES_PROJECT_PRODUCTION  — Pages project name (e.g. foodie)
#   VITE_API_BASE_URL_PRODUCTION         — Worker/API base URL for frontend build
#   WORKER_WEBAPP_ORIGIN_PRODUCTION      — e.g. https://foodie.example.com
#   WORKER_RP_ID_PRODUCTION              — e.g. foodie.example.com
#   WORKER_SESSION_TTL_SECONDS           — e.g. 2592000
#   WORKER_MAGIC_LINK_TTL_SECONDS        — e.g. 900
#   WORKER_BREVO_API_KEY                 — optional (magic-link email delivery)
#   WORKER_MAGIC_LINK_FROM_EMAIL         — optional (required if BREVO enabled)
#   WORKER_MAGIC_LINK_FROM_NAME          — optional (default: Foodie)
#
# Checkout the tagged commit (`github.sha`) so production matches the tag, not the moving `main` tip.

name: Release to Production

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  deploy-worker-production:
    runs-on: ubuntu-latest
    name: Deploy Worker (production)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Typecheck worker
        working-directory: worker
        run: npm run typecheck

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        env:
          WORKER_WEBAPP_ORIGIN: ${{ secrets.WORKER_WEBAPP_ORIGIN_PRODUCTION }}
          WORKER_RP_ID: ${{ secrets.WORKER_RP_ID_PRODUCTION }}
          WORKER_SESSION_TTL_SECONDS: ${{ secrets.WORKER_SESSION_TTL_SECONDS }}
          WORKER_MAGIC_LINK_TTL_SECONDS: ${{ secrets.WORKER_MAGIC_LINK_TTL_SECONDS }}
          WORKER_BREVO_API_KEY: ${{ secrets.WORKER_BREVO_API_KEY }}
          WORKER_MAGIC_LINK_FROM_EMAIL: ${{ secrets.WORKER_MAGIC_LINK_FROM_EMAIL }}
          WORKER_MAGIC_LINK_FROM_NAME: ${{ secrets.WORKER_MAGIC_LINK_FROM_NAME }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: >-
            deploy
            --var VERSION:${{ github.ref_name }}
            --var WEBAPP_ORIGIN:${{ env.WORKER_WEBAPP_ORIGIN }}
            --var RP_ID:${{ env.WORKER_RP_ID }}
            --var SESSION_TTL_SECONDS:${{ env.WORKER_SESSION_TTL_SECONDS }}
            --var MAGIC_LINK_TTL_SECONDS:${{ env.WORKER_MAGIC_LINK_TTL_SECONDS }}
            --var BREVO_API_KEY:${{ env.WORKER_BREVO_API_KEY }}
            --var MAGIC_LINK_FROM_EMAIL:${{ env.WORKER_MAGIC_LINK_FROM_EMAIL }}
            --var MAGIC_LINK_FROM_NAME:${{ env.WORKER_MAGIC_LINK_FROM_NAME }}

  deploy-frontend-production:
    runs-on: ubuntu-latest
    name: Deploy Pages (production)
    needs: deploy-worker-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL_PRODUCTION }}

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_PRODUCTION }} --branch=main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
