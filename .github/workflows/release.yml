name: Release to Production

on:
  push:
    tags:
      - 'v*'   # triggers on v2.1.0, v2.2.0, etc.

jobs:
  deploy-worker-production:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    name: Deploy Worker (production)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install worker deps
        working-directory: worker
        run: npm ci

      - name: Type-check worker
        working-directory: worker
        run: npm run type-check

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: latest
          apiToken:         ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId:        ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # Deploys to a production environment defined in wrangler.toml
          command:          deploy --env production

  deploy-frontend-production:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    name: Deploy Frontend (production)
    needs: deploy-worker-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install frontend deps
        run: npm ci --legacy-peer-deps

      - name: Type-check frontend
        run: npm run type-check

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://foodie-api.tojemoc.workers.dev

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: latest
          apiToken:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # Deploys to the production Pages project (separate from production)
          command:   pages deploy ../dist --project-name=foodie-production --branch=main
